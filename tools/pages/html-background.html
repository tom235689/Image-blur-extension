<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>background on html</title>
    <style>
      html { background-image: url("checker.png"); background-size: 200px }
      body { margin: 0; min-height: 1200px }
      .card { margin: 40px; padding: 20px; background: #fff }
    </style>
  </head>
  <body>
    <div class="card">the background image is declared on the html element</div>
  </body>
</html>
