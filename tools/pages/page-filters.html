<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>filters the page applies itself</title>
    <style>
      body { font: 14px system-ui; margin: 0; padding: 16px; background: #fff; color: #111 }
      .case { margin: 10px 0; padding: 8px; border: 1px solid #ccc }
      /* A site styling its own images. Nothing here is the extension's business. */
      #own-filter { filter: grayscale(1) }
      #own-transition { transition: opacity 400ms ease-in-out }
      #own-filter-small { filter: grayscale(1) }
      #plain-anchor { position: absolute; top: 0; left: 0 }
    </style>
  </head>
  <body>
    <h1>filters the page applies to its own images</h1>

    <div class="case">
      <img id="own-filter" src="checker.png" width="120" height="120" />
    </div>

    <div class="case">
      <img id="own-filter-small" src="checker.png" width="24" height="24" />
    </div>

    <div class="case">
      <img id="no-filter" src="checker.png" width="120" height="120" />
    </div>

    <div class="case">
      <img id="own-transition" src="checker.png" width="120" height="120" />
    </div>

    <div class="case" style="position: relative; height: 40px">
      <span id="plain-anchor">positioned by the page</span>
    </div>
  </body>
</html>
