<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>background that only exists on hover</title>
    <style>
      body { margin: 0; padding: 40px }
      #hovercard { width: 240px; height: 140px; background: #ddd }
      #hovercard:hover { background-image: url("checker.png"); background-size: cover }
    </style>
  </head>
  <body>
    <div id="hovercard"></div>
  </body>
</html>
