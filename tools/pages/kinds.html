<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>one of every kind</title>
    <style>
      body { font: 14px system-ui; margin: 0; padding: 16px; background: #fff; color: #111 }
      .case { margin: 10px 0 }
      #tile { width: 200px; height: 120px; background-image: url("checker.png"); background-size: cover }
      /* A filter the page asked for itself: a kind left alone has to keep it. */
      #photo { filter: grayscale(1) }
    </style>
  </head>
  <body>
    <h1>one of every kind of media</h1>
    <div class="case"><img id="photo" src="checker.png" width="120" height="120" /></div>
    <div class="case"><video id="clip" width="200" height="120" poster="checker.png"></video></div>
    <div class="case"><canvas id="painting" width="120" height="120"></canvas></div>
    <div class="case"><div id="tile"></div></div>
    <div class="case"><svg id="artwork" width="120" height="120"><circle cx="60" cy="60" r="55" fill="#e11" /></svg></div>
    <script>
      const context = document.getElementById('painting').getContext('2d');
      context.fillStyle = '#0a0';
      context.fillRect(0, 0, 120, 120);
    </script>
  </body>
</html>
